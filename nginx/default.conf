server {
    listen 80;
    server_name localhost;

    # Maximum file upload size
    client_max_body_size 50M;

    # Use Docker's internal DNS resolver so upstreams are resolved at
    # request time instead of at startup.  This prevents nginx from
    # crashing when a backend container hasn't registered yet.
    resolver 127.0.0.11 valid=10s;

    # Proxy GraphQL requests (including WebSockets for subscriptions)
    location /graphql {
        set $upstream_server http://server:3001;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for subscriptions
        proxy_buffering off;
    }

    # Proxy Auth REST requests
    location /auth {
        set $upstream_server http://server:3001;
        proxy_pass $upstream_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Upload REST requests
    location /upload {
        set $upstream_server http://server:3001;
        proxy_pass $upstream_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other requests to Vite React client dev server
    location / {
        set $upstream_client http://client:3000;
        proxy_pass $upstream_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
